<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전 골든벨 미니</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f3f6fb;
    color: #172033;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  h1 { margin-top: 0; }
  .badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    background: #e8eefc;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .question {
    font-size: 23px;
    line-height: 1.5;
    font-weight: 700;
    margin: 18px 0;
  }
  .choices {
    display: grid;
    gap: 12px;
  }
  button.choice {
    width: 100%;
    padding: 16px;
    border: 2px solid #dbe1ec;
    border-radius: 12px;
    background: white;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
  }
  button.choice:hover { background: #f7f9fd; }
  button.choice.correct { border-color: #27864b; background: #eaf8ef; }
  button.choice.wrong { border-color: #c83b3b; background: #fff0f0; }
  .feedback {
    min-height: 28px;
    margin: 18px 0 8px;
    font-weight: 700;
  }
  .next {
    padding: 13px 22px;
    border: 0;
    border-radius: 10px;
    background: #172033;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  .next:disabled { opacity: .4; cursor: default; }
  .score { float: right; font-weight: 700; }
  .result { text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="badge" id="progress">문제 1 / 2</div>
    <span class="score" id="score">점수 0</span>

    <div id="quiz">
      <div class="question" id="question"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="next" disabled>다음 문제</button>
    </div>

    <div class="result" id="result" hidden>
      <h2>🎉 안전 골든벨 완료!</h2>
      <p id="finalScore"></p>
      <button class="next" onclick="location.reload()">다시 하기</button>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    question: "교실 바닥에 물이 흥건하게 고여 있습니다. 가장 먼저 할 행동은?",
    choices: [
      "그냥 지나간다.",
      "친구에게 조심하라고만 말한다.",
      "주변에 알리고 물기를 제거하도록 한다.",
      "물을 뛰어넘어 지나간다."
    ],
    answer: 2,
    explanation: "미끄러져 다칠 수 있으므로 주변에 알리고 즉시 안전조치를 하는 것이 중요합니다."
  },
  {
    question: "복도에서 뛰다가 친구와 부딪혔습니다. 가장 안전한 행동은?",
    choices: [
      "괜찮다고 하고 계속 뛴다.",
      "상황을 확인하고 다친 사람이 있는지 살핀다.",
      "친구에게 장난이었다고 한다.",
      "아무 말 없이 자리를 떠난다."
    ],
    answer: 1,
    explanation: "사고가 발생했을 때는 먼저 상황과 부상 여부를 확인하고 필요한 도움을 요청해야 합니다."
  }
];

let current = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next");
const progressEl = document.getElementById("progress");
const scoreEl = document.getElementById("score");

function showQuestion() {
  answered = false;
  const q = questions[current];

  progressEl.textContent = `문제 ${current + 1} / ${questions.length}`;
  questionEl.textContent = q.question;
  feedbackEl.textContent = "";
  nextBtn.disabled = true;
  choicesEl.innerHTML = "";

  q.choices.forEach((choice, index) => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = `${index + 1}. ${choice}`;
    button.onclick = () => selectAnswer(index);
    choicesEl.appendChild(button);
  });
}

function selectAnswer(index) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const buttons = document.querySelectorAll(".choice");

  buttons[q.answer].classList.add("correct");

  if (index === q.answer) {
    score += 1;
    feedbackEl.textContent = "⭕ 정답입니다!";
  } else {
    buttons[index].classList.add("wrong");
    feedbackEl.textContent = `❌ 오답입니다. ${q.explanation}`;
  }

  scoreEl.textContent = `점수 ${score}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener("click", () => {
  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("quiz").hidden = true;
    document.getElementById("result").hidden = false;
    document.getElementById("finalScore").textContent =
      `2문제 중 ${score}문제를 맞혔습니다.`;
  }
});

showQuestion();
</script>
</body>
</html>
